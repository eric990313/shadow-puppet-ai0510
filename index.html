<script>

async function generateImage(){

    const text =
    document.getElementById("prompt").value.trim();

    if(!text){

        alert("請輸入角色描述");

        return;
    }

    const loading =
    document.getElementById("loading");

    const img =
    document.getElementById("result");

    loading.innerHTML =
    "🎨 AI生成中...";

    let finalPrompt = "";

    if(text.includes("關公")){

        finalPrompt = `
Guan Yu,
red face,
long black beard,
Green Dragon Crescent Blade,
Ancient Chinese General,
Traditional Chinese Shadow Puppet,
ornate leather carving,
full body,
extremely detailed,
masterpiece
`;

    }

    else if(text.includes("皇帝")){

        finalPrompt = `
Chinese Emperor,
Golden Dragon Robe,
Royal Crown,
Traditional Chinese Shadow Puppet,
full body,
highly detailed,
masterpiece
`;

    }

    else if(text.includes("公主")){

        finalPrompt = `
Chinese Princess,
Phoenix Crown,
Chinese Royal Dress,
Traditional Chinese Shadow Puppet,
full body,
highly detailed,
masterpiece
`;

    }

    else if(text.includes("孫悟空")){

        finalPrompt = `
Sun Wukong,
Monkey King,
Golden Staff,
Chinese Shadow Puppet,
full body,
highly detailed,
masterpiece
`;

    }

    else{

        finalPrompt = `
Traditional Chinese Shadow Puppet,
${text},
full body,
highly detailed,
masterpiece
`;

    }

    try{

        const response =
        await fetch(
        "https://shadow-puppet-ai0510.vercel.app/api/generate",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                prompt:finalPrompt

            })
        });

        const data =
        await response.json();

        if(data.image){

            img.src =
            data.image;

            img.style.display =
            "block";

            loading.innerHTML =
            "";

        }else{

            loading.innerHTML =
            "❌ AI沒有回傳圖片";

        }

    }

    catch(error){

        console.error(error);

        loading.innerHTML =
        "❌ 圖片生成失敗";

    }

}

function startVoice(){

    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert("請使用Chrome");

        return;
    }

    const recognition =
    new SpeechRecognition();

    recognition.lang =
    "zh-TW";

    recognition.onresult =
    function(event){

        document
        .getElementById("prompt")
        .value =
        event.results[0][0].transcript;

    };

    recognition.start();

}

</script>
