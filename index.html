<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Shadow Puppet Character Generator</title>

<style>

body{

    margin:0;

    padding:20px;

    background:#000000;

    color:white;

    text-align:center;

    font-family:"Microsoft JhengHei",sans-serif;

}

h1{

    color:#fbbf24;

    margin-bottom:30px;

    font-size:40px;

}

h3{

    color:white;

    margin-top:20px;

}

select{

    width:380px;

    padding:12px;

    font-size:18px;

    margin:10px;

    border-radius:10px;

    border:none;

}

button{

    padding:15px 35px;

    font-size:22px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    background:#2563eb;

    color:white;

}

button:hover{

    background:#1d4ed8;

}

#loading{

    margin-top:25px;

    font-size:28px;

    color:#fbbf24;

    font-weight:bold;

}

#stage{

    margin-top:20px;

}

#resultVideo{

    width:80vw;

    max-height:75vh;

    object-fit:contain;

    background:black;

    border-radius:20px;

}

</style>

</head>

<body>

<h1>

AI Shadow Puppet Character Generator

</h1>

<h3>角色 Character</h3>

<select id="character">

<option>軍人 Soldier</option>

<option>警察 Police Officer</option>

<option>坦克 Tank</option>

<option>戰鬥機 Fighter Jet</option>

</select>

<h3 id="weaponTitle">

武器 Weapon

</h3>

<select id="weapon">

<option>步槍 Rifle</option>

<option>法杖 Magic Staff</option>

<option>手槍 Pistol</option>

</select>

<br><br>

<button onclick="generateVideo()">

🎬 AI Generate Video

</button>

<button
id="startBtn"
onclick="startPlayback()"
style="display:none;margin-left:10px;">

▶ Start Presentation

</button>

<div id="loading"></div>

<div id="stage">

<video
id="resultVideo"
controls
loop
playsinline>
</video>

</div>

<script>

let pendingVideo = "";

document
.getElementById("character")
.addEventListener("change",function(){

const role =
this.value;

const weapon =
document.getElementById("weapon");

const weaponTitle =
document.getElementById("weaponTitle");

if(
role.includes("Tank") ||
role.includes("Fighter Jet")
){

weapon.style.display =
"none";

weaponTitle.style.display =
"none";

}
else{

weapon.style.display =
"inline-block";

weaponTitle.style.display =
"block";

}

});

function generateVideo(){

document.getElementById("loading")
.innerHTML =
"⏳ AI is generating video... Please wait.";

document.getElementById("startBtn")
.style.display =
"none";

const role =
document.getElementById("character").value;

const weapon =
document.getElementById("weapon").value;

let file = "";

if(role.includes("Soldier")){

    if(weapon.includes("Rifle"))
    file="videos/soldier_rifle.mp4";

    if(weapon.includes("Magic Staff"))
    file="videos/soldier_staff.mp4";

    if(weapon.includes("Pistol"))
    file="videos/soldier_pistol.mp4";

}

if(role.includes("Police")){

    if(weapon.includes("Rifle"))
    file="videos/police_rifle.mp4";

    if(weapon.includes("Magic Staff"))
    file="videos/police_staff.mp4";

    if(weapon.includes("Pistol"))
    file="videos/police_pistol.mp4";

}

if(role.includes("Tank")){

    file="videos/tank.mp4";

}

if(role.includes("Fighter Jet")){

    file="videos/fighterjet.mp4";

}

setTimeout(function(){

    pendingVideo = file;

    document.getElementById("loading")
    .innerHTML =
    "✅ Video Ready<br><br>Press Full Screen and Click Start";

    document.getElementById("startBtn")
    .style.display =
    "inline-block";

},3000);

}

function startPlayback(){

const video =
document.getElementById("resultVideo");

video.src =
pendingVideo;

video.load();

video.play();

if(document.documentElement.requestFullscreen){

document.documentElement.requestFullscreen();

}

document.getElementById("loading")
.innerHTML =
"🎬 Now Playing";

document.getElementById("startBtn")
.style.display =
"none";

}

</script>

</body>

</html>
