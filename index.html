<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI皮影戲人物生成器</title>

<style>

body{
    background:#111827;
    color:white;
    font-family:Microsoft JhengHei;
    text-align:center;
    padding:30px;
}

h1{
    color:#fbbf24;
}

textarea{

    width:90%;
    max-width:800px;

    height:180px;

    padding:15px;

    font-size:18px;

}

button{

    padding:15px 25px;

    margin:10px;

    border:none;

    border-radius:10px;

    cursor:pointer;

}

#result{

    max-width:900px;

    width:90%;

    margin-top:20px;

    display:none;

}

</style>

</head>

<body>

<h1>AI皮影戲人物生成器</h1>

<textarea
id="prompt"
placeholder="例如：關公">
</textarea>

<br>

<button onclick="generateImage()">

生成人物

</button>

<button onclick="startVoice()">

🎤語音輸入

</button>

<div id="loading"></div>

<img id="result">

<script>

async function generateImage(){

    const text =
    document.getElementById("prompt").value.trim();

    if(!text){

        alert("請輸入角色描述");

        return;
    }

    const loading =
    document.getElementById("loading");

    const img =
    document.getElementById("result");

    loading.innerHTML =
    "🎨 AI生成中...";

    let finalPrompt = "";

    if(text.includes("關公")){

        finalPrompt = `
Guan Yu,
red face,
long black beard,
Green Dragon Crescent Blade,
Traditional Chinese shadow puppet,
full body,
highly detailed
`;

    }

    else{

        finalPrompt = `
Traditional Chinese shadow puppet,
${text},
full body,
highly detailed
`;

    }

    try{

        const response =
        await fetch(
        "https://shadow-puppet-ai0510.vercel.app/api/generate",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                prompt:finalPrompt
            })
        });

        const data =
        await response.json();

        console.log(data);

        if(data.image){

            img.src =
            data.image;

            img.style.display =
            "block";

            loading.innerHTML =
            "";

        }else{

            loading.innerHTML =
            "❌ AI沒有回傳圖片";

        }

    }

    catch(error){

        console.error(error);

        loading.innerHTML =
        "❌ 圖片生成失敗";

    }

}

function startVoice(){

    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert("請使用 Chrome");

        return;

    }

    const recognition =
    new SpeechRecognition();

    recognition.lang =
    "zh-TW";

    recognition.onresult =
    function(event){

        document
        .getElementById("prompt")
        .value =
        event.results[0][0].transcript;

    };

    recognition.start();

}

</script>

</body>

</html>
