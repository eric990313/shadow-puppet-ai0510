<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI皮影戲人物生成器</title>

<style>

body{
    margin:0;
    padding:30px;
    background:#111827;
    color:white;
    font-family:"Microsoft JhengHei",sans-serif;
    text-align:center;
}

h1{
    color:#fbbf24;
}

textarea{

    width:90%;
    max-width:800px;

    height:180px;

    padding:15px;

    font-size:18px;

    border-radius:10px;

    border:none;

    resize:none;

}

button{

    padding:15px 25px;

    font-size:18px;

    margin:10px;

    border:none;

    border-radius:10px;

    cursor:pointer;

}

.generate{

    background:#2563eb;

    color:white;

}

.voice{

    background:#dc2626;

    color:white;

}

#loading{

    margin-top:20px;

    font-size:20px;

    color:#fbbf24;

}

#result{

    display:none;

    width:90%;

    max-width:900px;

    margin-top:25px;

    border-radius:15px;

    box-shadow:0 0 20px rgba(0,0,0,.5);

}

</style>

</head>

<body>

<h1>AI皮影戲人物生成器</h1>

<p>
請輸入人物描述，例如：
<br>
紅臉關公拿青龍偃月刀、綠色戰袍、攻擊姿勢
</p>

<textarea
id="prompt"
placeholder="請輸入角色描述">
</textarea>

<br>

<button
class="generate"
onclick="generateImage()">
生成人物
</button>

<button
class="voice"
onclick="startVoice()">
🎤語音輸入
</button>

<div id="loading"></div>

<img id="result">

<script>

function generateImage(){

    const text =
    document.getElementById("prompt").value.trim();

    if(!text){

        alert("請輸入角色描述");

        return;
    }

    document
    .getElementById("loading")
    .innerHTML =
    "🎨 AI 正在生成圖片，請稍候...";

    const img =
    document.getElementById("result");

const prompt = `
Traditional Chinese shadow puppet,
${text}
`;

    const imageUrl =
    "https://image.pollinations.ai/prompt/"
    +
    encodeURIComponent(prompt)
    +
    "?width=1024&height=1024&seed="
    +
    Date.now();

    console.log(imageUrl);
   
    img.onload = function(){

        document
        .getElementById("loading")
        .innerHTML = "";

        img.style.display = "block";
    };

    img.onerror = function(){

        document
        .getElementById("loading")
        .innerHTML =
        "❌ 圖片生成失敗，請再試一次";
    };

    img.src = imageUrl;
}

function startVoice(){

    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert("您的瀏覽器不支援語音辨識，請使用 Google Chrome");

        return;
    }

    const recognition =
    new SpeechRecognition();

    recognition.lang = "zh-TW";

    recognition.start();

    document
    .getElementById("loading")
    .innerHTML =
    "🎤 正在聆聽...";

    recognition.onresult =
    function(event){

        let speechText =
        event.results[0][0].transcript;

        document
        .getElementById("prompt")
        .value =
        speechText;

        document
        .getElementById("loading")
        .innerHTML =
        "✅ 語音辨識完成";

    };
}

</script>

</body>

</html>
