<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Shadow Puppet Character Generator</title>

<style>

body{

    margin:0;

    padding:20px;

    background:#000000;

    color:white;

    text-align:center;

    font-family:"Microsoft JhengHei",sans-serif;

}

h1{

    color:#fbbf24;

}

h3{

    color:white;

}

select{

    width:320px;

    padding:12px;

    font-size:18px;

    margin:10px;

    border-radius:10px;

    border:none;

}

button{

    padding:15px 30px;

    font-size:20px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    background:#2563eb;

    color:white;

}

button:hover{

    background:#1d4ed8;

}

#loading{

    margin-top:20px;

    color:#fbbf24;

    font-size:22px;

}

#stage{

    width:100%;

    margin-top:20px;

}

#resultVideo{

    width:80vw;

    max-height:75vh;

    object-fit:contain;

    background:black;

    border-radius:20px;

}

</style>

</head>

<body>

<h1>

AI Shadow Puppet Character Generator

</h1>

<h3>角色 Character</h3>

<select id="character">

<option>軍人</option>

<option>警察</option>

<option>坦克</option>

<option>戰鬥機</option>

</select>

<h3 id="weaponTitle">

武器 Weapon

</h3>

<select id="weapon">

<option>步槍</option>

<option>法杖</option>

<option>手槍</option>

</select>

<br><br>

<button onclick="generateVideo()">

🎬 播放角色動畫

</button>

<div id="loading"></div>

<div id="stage">

<video
id="resultVideo"
controls
autoplay
loop
playsinline>
</video>

</div>

<script>

const characterSelect =
document.getElementById("character");

characterSelect.addEventListener(
"change",
function(){

const role =
this.value;

const weapon =
document.getElementById("weapon");

const weaponTitle =
document.getElementById("weaponTitle");

if(
role==="坦克" ||
role==="戰鬥機"
){

weapon.style.display="none";

weaponTitle.style.display="none";

}
else{

weapon.style.display="inline-block";

weaponTitle.style.display="block";

}

}
);

function generateVideo(){

const role =
document.getElementById("character").value;

const weapon =
document.getElementById("weapon").value;

let file = "";

if(role==="軍人"){

    if(weapon==="步槍")
    file="videos/soldier_rifle.mp4";

    if(weapon==="法杖")
    file="videos/soldier_staff.mp4";

    if(weapon==="手槍")
    file="videos/soldier_pistol.mp4";

}

if(role==="警察"){

    if(weapon==="步槍")
    file="videos/police_rifle.mp4";

    if(weapon==="法杖")
    file="videos/police_staff.mp4";

    if(weapon==="手槍")
    file="videos/police_pistol.mp4";

}

if(role==="坦克"){

    file="videos/tank.mp4";

}

if(role==="戰鬥機"){

    file="videos/fighterjet.mp4";

}

document.getElementById("loading")
.innerHTML =
"✅ Playing Video";

const video =
document.getElementById("resultVideo");

video.src = file;

video.load();

video.play();

}

</script>

</body>

</html>
