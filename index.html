<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>測試API</title>
</head>
<body>

<h1>測試成功</h1>

<div id="loading"></div>

<button onclick="generateImage()">
測試API
</button>

<script>

function generateImage(){

    document.getElementById("loading").innerHTML =
    "按鈕成功";

    fetch(
    "https://shadow-puppet-ai0510.vercel.app/api/generate",
    {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            prompt:"cat"
        })
    })
    .then(r=>r.json())
    .then(data=>{

        console.log(data);

        document.getElementById("loading").innerHTML =
        JSON.stringify(data);

    })
    .catch(err=>{

        console.log(err);

        document.getElementById("loading").innerHTML =
        "錯誤：" + err.message;

    });

}

</script>

</body>
</html>
