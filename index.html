<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI皮影戲人物生成器</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:"Microsoft JhengHei",sans-serif;
    text-align:center;
    padding:20px;
}

h1{
    color:#fbbf24;
}

textarea{
    width:90%;
    max-width:800px;
    height:180px;
    padding:15px;
    font-size:18px;
    border-radius:10px;
    border:none;
}

button{
    padding:15px 25px;
    margin:10px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#loading{
    margin-top:20px;
    color:#fbbf24;
    font-size:20px;
}

#result{
    width:90%;
    max-width:900px;
    margin-top:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}

</style>

</head>

<body>

<h1>AI皮影戲人物生成器</h1>

<p>
請輸入人物描述，例如：
<br>
關公拿青龍偃月刀、紅臉、綠袍
</p>

<textarea
id="prompt"
placeholder="請輸入角色描述">
</textarea>

<br>

<button onclick="generateImage()">
🎨 生成人物
</button>

<button onclick="startVoice()">
🎤 語音輸入
</button>

<div id="loading"></div>

<img id="result">

<script>

function convertPrompt(text){

    if(text.includes("關公")){

        return `
Traditional Chinese shadow puppet,
Guan Yu,
red face,
long black beard,
Green Dragon Crescent Blade,
green armor,
full body,
ornate leather carving,
dramatic stage lighting,
masterpiece,
highly detailed
`;

    }

    if(text.includes("皇帝")){

        return `
Traditional Chinese shadow puppet,
Chinese Emperor,
gold dragon robe,
royal crown,
full body,
ornate leather carving,
highly detailed,
masterpiece
`;

    }

    if(text.includes("公主")){

        return `
Traditional Chinese shadow puppet,
Chinese Princess,
phoenix crown,
royal dress,
full body,
highly detailed,
masterpiece
`;

    }

    if(text.includes("孫悟空")){

        return `
Traditional Chinese shadow puppet,
Sun Wukong,
Monkey King,
golden staff,
full body,
highly detailed,
masterpiece
`;

    }

    return `
Traditional Chinese shadow puppet,
${text},
full body,
ornate leather carving,
highly detailed,
masterpiece
`;

}

function generateImage(){

    const text =
    document.getElementById("prompt").value.trim();

    if(!text){

        alert("請輸入角色描述");

        return;

    }

    document.getElementById("loading")
    .innerHTML =
    "🎨 AI生成中，請稍候...";

    document.getElementById("result")
    .src = "";

    fetch(
    "https://shadow-puppet-ai0510.vercel.app/api/generate",
    {
        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            prompt:
            convertPrompt(text)

        })

    })
    .then(r=>r.json())
    .then(data=>{

        if(data.image){

            document.getElementById("result")
            .src =
            data.image;

            document.getElementById("loading")
            .innerHTML =
            "✅ 生成完成";

        }

        else{

            document.getElementById("loading")
            .innerHTML =
            JSON.stringify(data);

        }

    })
    .catch(err=>{

        document.getElementById("loading")
        .innerHTML =
        "❌ " + err.message;

    });

}

function startVoice(){

    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert("請使用 Chrome");

        return;

    }

    const recognition =
    new SpeechRecognition();

    recognition.lang =
    "zh-TW";

    recognition.start();

    document.getElementById("loading")
    .innerHTML =
    "🎤 正在聆聽...";

    recognition.onresult =
    function(event){

        const text =
        event.results[0][0].transcript;

        document.getElementById("prompt")
        .value =
        text;

        document.getElementById("loading")
        .innerHTML =
        "✅ 已輸入：" + text;

    };

    recognition.onerror =
    function(){

        document.getElementById("loading")
        .innerHTML =
        "❌ 語音辨識失敗";

    };

}

</script>

</body>
</html>
