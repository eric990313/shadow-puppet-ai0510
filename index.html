<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>測試API</title>
</head>
<body>

<h1>測試成功</h1>

<div id="loading"></div>
    
<img id="result" width="500">


<button onclick="generateImage()">
測試API
</button>

<script>

function generateImage(){

fetch(
"https://shadow-puppet-ai0510.vercel.app/api/generate",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
prompt:"Traditional Chinese shadow puppet Guan Yu"
})
}
)
.then(r=>r.json())
.then(data=>{

document.getElementById("loading")
.innerHTML = "";

document.getElementById("result")
.src =
data.image;

})
.catch(err=>{

document.getElementById("loading")
.innerHTML =
err.message;

});

}

</script>

</body>
</html>
