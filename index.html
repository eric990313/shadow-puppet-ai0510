<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI皮影戲人物生成器</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#111827;
    color:white;
    font-family:"Microsoft JhengHei",sans-serif;
    text-align:center;
}

h1{
    color:#fbbf24;
}

h3{
    margin-top:20px;
}

select{

    width:300px;

    padding:12px;

    font-size:18px;

    border-radius:10px;

    border:none;

    margin:10px;

}

button{

    background:#2563eb;

    color:white;

    padding:15px 30px;

    border:none;

    border-radius:10px;

    font-size:20px;

    cursor:pointer;

    margin-top:20px;

}

button:hover{

    background:#1d4ed8;

}

#loading{

    margin-top:20px;

    font-size:20px;

    color:#fbbf24;

}

#result{

    width:90%;

    max-width:700px;

    display:block;

    margin:30px auto;

    border-radius:20px;

    transform-origin:center bottom;

}

/* 登場＋待機動畫 */

.show{

    animation:
    entrance 1s ease-out,
    idle 4s ease-in-out infinite;

}

@keyframes entrance{

    0%{

        opacity:0;

        transform:
        translateY(100px)
        scale(.9);

    }

    100%{

        opacity:1;

        transform:
        translateY(0px)
        scale(1);

    }

}

@keyframes idle{

    0%{

        transform:
        translateY(0px)
        rotate(-0.8deg);

    }

    25%{

        transform:
        translateY(-4px)
        rotate(0.8deg);

    }

    50%{

        transform:
        translateY(-8px)
        rotate(0deg);

    }

    75%{

        transform:
        translateY(-4px)
        rotate(-0.8deg);

    }

    100%{

        transform:
        translateY(0px)
        rotate(0.8deg);

    }

}

</style>

</head>

<body>

<h1>AI皮影戲人物生成器</h1>

<h3>角色</h3>

<select id="character">

<option>軍人</option>
<option>警察</option>
<option>吸血鬼</option>
<option>卡通老鼠</option>
<option>偵探</option>
<option>小木偶</option>
<option>人魚</option>
<option>妖怪</option>
<option>平民</option>
<option>漁人</option>
<option>獸人</option>

</select>

<h3>武器</h3>

<select id="weapon">

<option>長槍</option>
<option>刀</option>
<option>劍</option>
<option>盾牌</option>
<option>法杖</option>
<option>棒球棍</option>
<option>手槍</option>
<option>手榴彈</option>

</select>

<br>

<button onclick="generateImage()">
🎨 生成人物
</button>

<div id="loading"></div>

<img id="result">

<script>

const characterMap = {

"軍人":"soldier",
"警察":"police officer",
"吸血鬼":"vampire",
"卡通老鼠":"cartoon mouse",
"偵探":"detective",
"小木偶":"wooden puppet",
"人魚":"mermaid",
"妖怪":"fantasy monster",
"平民":"villager",
"漁人":"fisherman",
"獸人":"orc warrior"

};

const weaponMap = {

"長槍":{
weapon:"long spear",
action:"thrust attack pose"
},

"刀":{
weapon:"knife",
action:"slash attack pose"
},

"劍":{
weapon:"sword",
action:"sword attack pose"
},

"盾牌":{
weapon:"shield",
action:"defense pose"
},

"法杖":{
weapon:"magic staff",
action:"casting magic ball"
},

"棒球棍":{
weapon:"baseball bat",
action:"baseball swing pose"
},

"手槍":{
weapon:"pistol",
action:"shooting pose"
},

"手榴彈":{
weapon:"grenade",
action:"throwing grenade pose"
}

};

function generateImage(){

const character =
characterMap[
document.getElementById("character").value
];

const weapon =
weaponMap[
document.getElementById("weapon").value
];

const prompt =

`
Traditional Chinese shadow puppet style,
${character},
holding ${weapon.weapon},
${weapon.action},
full body character,
character centered,
simple background,
highly detailed,
masterpiece,
cinematic lighting
`;

document.getElementById("loading")
.innerHTML =
"🎨 AI生成中，請稍候...";

fetch(
"https://shadow-puppet-ai0510.vercel.app/api/generate",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

prompt:prompt

})

}
)
.then(r=>r.json())
.then(data=>{

if(data.image){

const img =
document.getElementById("result");

img.classList.remove("show");

img.src =
data.image;

setTimeout(()=>{

img.classList.add("show");

},100);

document.getElementById("loading")
.innerHTML =
"✅ 生成完成";

}

else{

document.getElementById("loading")
.innerHTML =
JSON.stringify(data);

}

})
.catch(err=>{

document.getElementById("loading")
.innerHTML =
"❌ " + err.message;

});

}

</script>

</body>
</html>
